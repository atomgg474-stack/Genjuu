<!DOCTYPE html>
<!-- GENJUU_BUILD=2 -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genjuu Card Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: cozy, calm little spirit-card stall at a lantern festival; playful but relaxing
   IDEA: a wooden card stall: wood sign, kraft-paper shelves, a binder, a grading office and a hidden lab
   PICTURE: Momo the shop spirit on the sign, chase cards fanned on the season banner, foil packs on shelves
   COLOUR and TYPE: walnut brown and kraft tan lead, teal support, brass accent; Dela Gothic One + Nunito
   LAYOUT: wood sign with money + season, folder tabs, then the working shop view */
:root{color-scheme:light dark;--bg:light-dark(#e8d6b5,#1b120b);--paper:light-dark(#f7ecd8,#2a1c12);--panel:light-dark(#fbf3e4,#33231a);--ink:light-dark(#2b1b10,#f4e7d1);--mut:light-dark(#6e5640,#c9b394);--line:light-dark(#cdb38b,#4e3a28);--wood:#4a2e1c;--wood2:#2b190e;--brass:#e2a845;--teal:#2e7d7a;--red:#d4563a;--up:light-dark(#2f7d3f,#7fd892);--dn:light-dark(#b8402a,#ff8f78)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 15% 0%,#ffffff1c,transparent 40%),radial-gradient(circle at 90% 100%,#0000000f,transparent 45%);color:var(--ink);font:500 16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3{margin:0;line-height:1.08;text-wrap:balance}
h2{font:400 clamp(22px,3vw,30px)/1.1 "Dela Gothic One",sans-serif}
h3{font-size:17px;font-weight:900}
p{margin:.35em 0}
button{font:800 15px Nunito,sans-serif;min-height:44px;padding:0 16px;border:2px solid var(--wood2);border-radius:12px;background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--wood2);cursor:pointer;white-space:nowrap;transition:transform .08s}
button.alt{background:var(--panel);color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
button.gold{background:var(--brass);color:#2b190e}
button.sm{min-height:36px;padding:0 10px;font-size:14px}
button:disabled{opacity:.42;cursor:not-allowed}
button:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood2)}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.top{background:linear-gradient(180deg,#5a3822,#3a2416);background-image:repeating-linear-gradient(90deg,#ffffff07 0 3px,transparent 3px 41px),repeating-linear-gradient(0deg,#00000012 0 1px,transparent 1px 7px),linear-gradient(180deg,#5a3822,#3a2416);color:#f7ecd8;border-bottom:4px solid var(--brass);padding:14px max(3vw,14px);display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.mascot{width:96px;height:88px;flex:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.logo{font:400 clamp(32px,5vw,46px)/1 "Dela Gothic One",sans-serif;color:var(--brass);text-shadow:0 3px 0 #2b190e,0 0 18px #e2a84555;letter-spacing:.02em}
.logo small{font:800 14px Nunito;color:#e9d3ae;letter-spacing:0;margin-left:8px;text-shadow:none}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:6px;background:#2b190e;border:1px solid #e2a84588;padding:4px 12px;border-radius:30px;font-size:14px;color:#f7ecd8}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--brass);box-shadow:0 0 8px var(--brass)}
.stats{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.stats small{display:block;font-size:13px;color:#e0c9a3}
.stats b{font:400 clamp(20px,2.6vw,27px)/1.05 "Dela Gothic One";color:#fff3d6;white-space:nowrap}
.rank{width:210px}.rank #rtitle{color:#fff;font-weight:900;font-size:15px}
.meter{height:11px;background:#2b190e;border-radius:8px;margin:4px 0;overflow:hidden;border:1px solid #e2a84588}.meter i{display:block;height:100%;background:linear-gradient(90deg,#c98a4b,var(--brass));width:0;transition:width .5s}
.hact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hbtn{background:#2b190e;color:#f7ecd8;border-color:#e2a84588;box-shadow:0 3px 0 #1a0f08;min-height:40px;padding:0 12px;font-size:14px}
.hbtn.on{background:var(--brass);color:#2b190e}
#free{background:var(--brass);color:#2b190e}
#cartbtn{position:relative;background:var(--teal)}
#cartbtn em{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-style:normal;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;border:2px solid #2b190e;padding:0 5px}
.tick{background:#2b190e;color:#e9d3ae;padding:7px max(3vw,14px);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:2px solid #1a0f08}
.tick b{color:var(--brass)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:16px max(3vw,14px) 0;max-width:1320px;margin:0 auto;border-bottom:3px solid var(--wood)}
.tabs button{border-radius:12px 12px 0 0;box-shadow:none;border-bottom:0;background:var(--paper);color:var(--ink);border-color:var(--line)}
.tabs button.on{background:var(--wood);color:#f7ecd8;border-color:var(--wood)}
#labtab.lk{font-family:"Dela Gothic One";letter-spacing:.1em;opacity:.7}
#labtab.open{background:#2a1a33;color:var(--brass);border-color:#2a1a33}
main{padding:22px max(3vw,14px) 40px;max-width:1320px;margin:0 auto}
.banner{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center;background:linear-gradient(135deg,var(--sc),color-mix(in srgb,var(--sc) 55%,#2b190e));color:#fff8ea;border:3px solid var(--wood2);border-radius:18px;padding:clamp(18px,3vw,30px);margin-bottom:22px;overflow:hidden;box-shadow:0 5px 0 var(--wood2)}
.banner small{font-weight:900;letter-spacing:.04em;color:#ffe7bd}.banner h2{font-size:clamp(30px,4.5vw,48px);color:#fff8ea;text-shadow:0 3px 0 #2b190e66;margin:4px 0 8px}
.fan{position:relative;height:clamp(190px,24vw,250px)}
.fc{position:absolute;top:8px;left:50%;width:clamp(120px,14vw,155px);transform:translateX(calc(-50% + (var(--k) - 1) * 70%)) rotate(calc((var(--k) - 1) * 9deg));transform-origin:50% 120%;filter:drop-shadow(0 8px 10px #0005)}
.fc:nth-child(2){z-index:2;top:0}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,205px),1fr));gap:16px;padding:16px;background:var(--paper);border:2px solid var(--line);border-radius:16px;box-shadow:inset 0 -10px 0 #8a5a3222}
.prod{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px;box-shadow:0 4px 0 var(--line)}
input.qty{width:84px;min-height:44px;font:800 16px Nunito,sans-serif;text-align:center;border:2px solid var(--ink);border-radius:12px;background:var(--panel);color:var(--ink);padding:0 6px;cursor:pointer}
.ptag{position:absolute;top:10px;left:10px;z-index:2;background:var(--wood);color:#f7ecd8;font-size:12px;font-weight:900;padding:2px 9px;border-radius:20px}.ptag.new{background:var(--red);color:#fff}
.prod p{color:var(--mut);font-size:15px;flex:1}
.pa{height:140px;display:grid;place-items:center}.pa svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 5px 4px #0003);transition:transform .2s}
.prod:hover .pa svg{transform:translateY(-4px) rotate(-2deg)}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 0 6px}.pr b{font:400 21px "Dela Gothic One";white-space:nowrap}
.vint{margin-top:30px}.vhd{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:16px 0 10px}
.up{color:var(--up);font-weight:900;white-space:nowrap}.dn{color:var(--dn);font-weight:900;white-space:nowrap}.fl{color:var(--mut);white-space:nowrap}
.note{color:var(--mut);font-size:14px;max-width:72ch}
.empty{text-align:center;padding:44px 16px;border:2px dashed var(--line);border-radius:16px;background:var(--paper)}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}.chip{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:none;min-height:40px}.chip.on{background:var(--wood);color:#f7ecd8;border-color:var(--wood)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px 14px}
.ghost{aspect-ratio:5/7;border:3px dashed var(--line);border-radius:10px;display:grid;place-items:center;align-content:center;color:var(--mut);background:var(--paper)}.ghost span{font:400 30px "Dela Gothic One"}.ghost small{font-size:13px}
.cbtn,.slot,.packbig{all:unset;display:block;position:relative;cursor:pointer;border-radius:10px}
.cbtn:focus-visible,.slot:focus-visible,.packbig:focus-visible{outline:3px solid var(--brass);outline-offset:4px}
.cnt{position:absolute;top:-9px;right:-7px;z-index:3;background:var(--red);color:#fff;font:900 13px Nunito;font-style:normal;padding:1px 8px;border-radius:20px;border:2px solid var(--wood2)}
.cap{display:flex;justify-content:space-between;gap:6px;font-size:13px;margin-top:6px;color:var(--mut)}.cap b{color:var(--ink)}
.inq{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:#2b190ecc;color:#fff3d6;border-radius:10px;font-weight:900;font-size:13px;text-align:center;padding:6px}
/* card */
.tilt{position:relative;border-radius:9px;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#ffffff66,transparent 48%);opacity:0;transition:opacity .25s;pointer-events:none;z-index:5;mix-blend-mode:soft-light}
.tilt.on::after{opacity:1}
.card{--tc:#999;--td:#555;position:relative;aspect-ratio:5/7;border-radius:9px;border:3px solid #3a2416;background:linear-gradient(165deg,color-mix(in srgb,var(--tc) 30%,#fff7e6),color-mix(in srgb,var(--tc) 62%,#fff1d6));color:#2b1b10;container-type:inline-size;overflow:hidden;box-shadow:0 4px 8px #2b190e40,inset 0 0 0 2px #fff6}
.ci{position:absolute;inset:0;padding:5cqw;display:flex;flex-direction:column;gap:2.2cqw}
.ctop{display:flex;align-items:center;gap:1.6cqw;font-size:7.6cqw;line-height:1}
.stg{font-size:4.2cqw;background:#2b1b1099;color:#fff;padding:.8cqw 1.6cqw;border-radius:2cqw;font-weight:800;white-space:nowrap}
.cname{flex:1;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{font-weight:900;font-size:7cqw;color:#7a2412;white-space:nowrap}.hp small{font-size:4cqw;margin-right:.4cqw}
.orb{--oc:#999;display:inline-block;flex:none;width:6.4cqw;height:6.4cqw;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fffc,transparent 42%),var(--oc);border:.6cqw solid #2b1b10;vertical-align:middle}
.orb.px{width:14px;height:14px;border-width:2px}
.art{position:relative;flex:none;aspect-ratio:100/72;border:1.4cqw solid #e9cf9a;box-shadow:0 0 0 .6cqw #3a2416,inset 0 0 0 .4cqw #fff5;border-radius:2cqw;overflow:hidden}
.art svg{display:block;width:100%;height:100%}
.cinfo{font-size:4.1cqw;text-align:center;font-style:italic;font-weight:800;background:linear-gradient(90deg,transparent,#fff8,transparent);border-radius:2cqw}
.moves{display:grid;gap:1.4cqw;align-content:start}
.mv{display:flex;align-items:center;gap:1.6cqw;font-size:5.6cqw;line-height:1.1;padding-bottom:1.3cqw;border-bottom:.4cqw solid #2b1b1030}
.mv .cost{display:flex;gap:.6cqw}.mv .orb{width:4.8cqw;height:4.8cqw;border-width:.45cqw}
.mv b{flex:1;font-weight:900}.mv em{font-style:normal;font-weight:900;font-size:6.8cqw}
.flav{font-size:4cqw;line-height:1.25;margin:0;font-style:italic;color:#2b1b10cc}
.cbot{display:flex;justify-content:space-between;align-items:center;gap:1cqw;font-size:4cqw;font-weight:800;margin-top:auto}.cbot .orb{width:4.6cqw;height:4.6cqw}
.rs{font-size:5.4cqw;color:#2b1b10}
@container (max-width:170px){.ci{gap:3cqw}.moves,.flav,.cinfo{display:none}.art{flex:1;aspect-ratio:auto}.ctop{font-size:9cqw}.stg{display:none}.hp{font-size:8.5cqw}.orb{width:8cqw;height:8cqw}.cbot{font-size:6cqw}.cbot .orb{width:6.5cqw;height:6.5cqw}.rs{font-size:8cqw}}
.r2{border-color:#2b4a7a}
.r3{border-color:#8f99b0;background:linear-gradient(160deg,#fff7e6,color-mix(in srgb,var(--tc) 45%,#e9f4ff),#fff0fa)}
.r3 .art::after,.r4::after,.r5::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 22%,#ff8cc855 34%,#8fe3ff55 44%,#fff08c55 54%,#a6ffb455 62%,transparent 74%);background-size:320% 320%;mix-blend-mode:color-dodge;animation:foil 5s ease-in-out infinite alternate;z-index:2}
@keyframes foil{from{background-position:0% 0%}to{background-position:100% 100%}}
.card.full .art{position:absolute;inset:0;border:0;box-shadow:none;border-radius:0;aspect-ratio:auto}
.card.full .ci{z-index:3}.card.full .ctop{background:#fff8ebd9;border-radius:2.5cqw;padding:1.8cqw}
.card.full .cinfo,.card.full .flav{display:none}
.card.full .moves{margin-top:auto;background:#fff8ebd9;border-radius:2.5cqw;padding:2cqw}
.card.full .cbot{margin-top:0;background:#fff8ebd9;border-radius:2.5cqw;padding:1cqw 2cqw}
@container (max-width:170px){.card.full .moves{display:none}.card.full .cbot{margin-top:auto}}
.r4{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,conic-gradient(#e8623a,#f0c419,#58a84a,#2f9fd6,#6b5a9e,#e86fb0,#e8623a) border-box}
.r5{border-color:#c9921a;box-shadow:0 0 0 2px #fff3c4,0 0 22px #f0c419cc}
/* slabs */
.slab{position:relative;padding:7px;border-radius:12px;background:linear-gradient(160deg,#ffffffaa,#e6dccb88);border:3px solid #bba57f;box-shadow:inset 0 0 0 2px #fff9,0 5px 0 #2b190e33}
.slab .lbl{display:flex;justify-content:space-between;align-items:center;gap:4px;background:#f6ecd8;color:#2b1b10;border:1px solid #b89a6a;border-radius:5px;font:900 11px/1.2 Nunito;padding:3px 6px;margin-bottom:6px}
.slab .lbl b{font:400 15px "Dela Gothic One"}
.slab.lab{background:linear-gradient(160deg,#3d2a4f,#1c1222);border-color:#e2a845}
.slab.lab .lbl{background:#1c1222;color:var(--brass);border-color:#e2a845}
/* rows */
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:clamp(14px,2.4vw,22px)}
.rows{display:grid;gap:8px;margin-top:12px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.thumb{width:58px;height:42px;flex:none;border-radius:6px;overflow:hidden;border:2px solid #3a2416}.thumb svg{width:100%;height:100%;display:block}
.thumb.pk{border:0;height:52px}
.rinfo{flex:1 1 150px;display:flex;flex-direction:column;line-height:1.25}.rinfo small{color:var(--mut);font-size:13px}
.rval{font-weight:900;white-space:nowrap;text-align:right;min-width:72px}
.qbar{flex:1 1 120px;height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#5fb3a8)}
.qty{display:flex;align-items:center;gap:8px}.qty b{min-width:22px;text-align:center}
.carttot{display:flex;justify-content:space-between;font:400 22px "Dela Gothic One";margin:16px 0 12px;padding-top:12px;border-top:2px dashed var(--line)}
.labwrap{background:radial-gradient(circle at 80% 0%,#e2a84533,transparent 40%),linear-gradient(160deg,#2a1a33,#160e1a);color:#f4e7d1;border:3px solid #e2a84566;border-radius:20px;padding:clamp(16px,3vw,30px)}
.labwrap .panel{background:#ffffff0d;border-color:#e2a84544;color:#f4e7d1}.labwrap .row{background:#ffffff10;border-color:#e2a84533}.labwrap .rinfo small,.labwrap .note{color:#cbb7d3}
.labwrap h2{color:var(--brass)}
.lanterns{display:flex;gap:16px;margin:6px 0 14px}.lanterns i{width:16px;height:22px;border-radius:8px;background:radial-gradient(#ffd27a,#d4563a);box-shadow:0 0 14px #ffb347;animation:glow 2.6s ease-in-out infinite alternate}.lanterns i:nth-child(2){animation-delay:.8s}.lanterns i:nth-child(3){animation-delay:1.6s}
@keyframes glow{to{opacity:.55;box-shadow:0 0 6px #ffb347}}
.locked{text-align:center;padding:60px 18px}
.news{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:10px}.news li{background:var(--panel);border-left:5px solid var(--brass);padding:10px 12px;border-radius:8px;font-size:15px}
.mk{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px;align-items:start}
/* modal */
#ov{position:fixed;inset:0;background:#160d07cc;display:grid;place-items:center;padding:12px;z-index:20;backdrop-filter:blur(3px)}
#ov[hidden]{display:none}
.mod{position:relative;background:var(--bg);border:3px solid var(--wood);border-radius:20px;box-shadow:0 10px 0 var(--wood2),0 20px 50px #0008;width:min(1080px,100%);max-height:calc(100vh - 24px);overflow:auto;padding:clamp(16px,3vw,28px)}
.x{position:absolute;top:10px;right:10px;width:44px;padding:0;font-size:22px;z-index:2}
.ohd{margin:0 52px 14px 0}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;margin-bottom:18px}.ogrid.many{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.slot{perspective:900px;aspect-ratio:5/7;animation:deal .45s both;animation-delay:calc(var(--i) * 35ms)}
@keyframes deal{from{transform:translateY(40px) scale(.7) rotate(-8deg);opacity:0}}
.flip{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.slot.down .flip{transform:rotateY(180deg)}
.slot.down:hover .flip{transform:rotateY(180deg) translateY(-4px)}
.face,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.back{transform:rotateY(180deg)}.back svg{width:100%;height:100%;display:block;border-radius:9px}
.slot.glow::before{content:"";position:absolute;inset:-6px;border-radius:14px;background:radial-gradient(var(--gc),transparent 70%);filter:blur(8px);z-index:-1;animation:pulse 1.6s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.5}}
.tear{text-align:center;padding:10px 0 20px}
.packbig{width:min(230px,58vw);margin:18px auto 8px;animation:bob 2.4s ease-in-out infinite}.packbig svg{width:100%;height:auto;display:block}
.packbig.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg) scale(1.05)}80%{transform:rotate(3deg) scale(1.1)}100%{transform:scale(1.35);opacity:0}}
.view{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:26px}
.copies{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.copies li{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.copies li>span:first-child{flex:1 1 140px}.copies li b{white-space:nowrap}
.stage{position:relative;width:min(250px,70vw);margin:12px auto}
.stage canvas,.stage .crease{position:absolute;inset:0;width:100%;height:100%;border-radius:9px;touch-action:none;z-index:6}
.stage canvas{cursor:grab}
.gbar{height:12px;width:min(250px,70vw);margin:8px auto;background:var(--paper);border:2px solid var(--ink);border-radius:8px;overflow:hidden}.gbar i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
.gt{text-align:center;font-weight:900;font-size:18px}
.gauge{position:relative;height:30px;width:min(360px,86vw);margin:10px auto 0;background:var(--paper);border:2px solid var(--ink);border-radius:16px;overflow:hidden}

 g.fillStyle="rgba(122,92,60,.9)";g.fillRect(0,0,W,H);for(let i=0;i<90;i++){g.fillStyle=`rgba(${70+R()*50|0},${55+R()*35|0},${35+R()*25|0},${.3+R()*.5})`;g.beginPath();g.arc(R()*W,R()*H,2+R()*14,0,7);g.fill()}

 if(d.unlock){const x=byId(d.unlock);if(!x)return;const v=view;return modal(`<div style="text-align:center"><h2>Unlock ${def(x).n}?</h2><div class="stage" style="width:min(200px,60vw)">${itemCard(x)}</div><p>${status(x)}, worth <b>${fmt(val(x))}</b>.</p><p>Once unlocked, it can be sold again, including by Sell everything and the other bulk buttons.</p><div class="btns" style="justify-content:center;margin-top:12px"><button class="alt" data-keeplock="${v?v.s+"-"+v.i:""}">Keep it locked</button><button style="background:var(--red)" data-dounlock="${x.id}|${v?v.s+"-"+v.i:""}">Yes, unlock it</button></div></div>`)}
 if(d.dounlock){const[id,vv]=d.dounlock.split("|"),x=byId(id);if(x){x.lock=false;toast(`${def(x).n} is unlocked.`);after()}if(vv){const[a,b2]=vv.split("-").map(Number);showView(a,b2)}else closeM();return}
 if(d.keeplock!==undefined){const vv=d.keeplock;if(vv){const[a,b2]=vv.split("-").map(Number);showView(a,b2)}else closeM();return}
 if(d.disp){const x=byId(d.disp),n=st.cards.filter(y=>y.disp).length;if(!x||x.inq)return;if(n>=2*st.up.case)return toast("Your display case is full. Upgrade it at the Counter or take a card off.");x.disp=true;note(7,.05);toast(`${def(x).n} is on display (+20% value).`);after();return reView()}
 if(d.undisp){const x=byId(d.undisp);if(x){x.disp=false;after();reView()}return}
 if(d.upg){const u=UPG.find(u=>u.k===d.upg),l=st.up[u.k],c=u.costs[l];if(c==null||st.cash<c)return;st.cash-=c;st.up[u.k]++;sfx.register();burst(lx,ly,RCOL,30);toast(`${u.n} upgraded to level ${st.up[u.k]}.`);if(u.k==="free")st.free=Math.min(st.free,Date.now()+freeMs());after();return}
 if(d.serve)return showServe(d.serve);
 if(d.sellto){const[cid,xid]=d.sellto.split("|"),c=st.cust.find(c=>c.id===cid),x=byId(xid);if(!c||!x||x.lock||!fits(x,c.w))return;const pay=val(x)*c.mult;st.cards=st.cards.filter(y=>y!==x);st.team=st.team.filter(id=>id!==x.id);st.cust=st.cust.filter(y=>y!==c);st.cash+=pay;st.stats.earn+=pay;ssc().earn+=pay;st.stats.cust++;ssc().cust++;sfx.register();burst(lx,ly,["#e2a845","#ffd27a"],24,"coin");floaty("+"+fmt(pay));toast(`${c.name} happily paid ${fmt(pay)} for ${def(x).n}.`);closeM();after();return}
 if(d.haggle){const c=st.cust.find(c=>c.id===d.haggle);if(!c||c.hag)return;c.hag=true;if(R()<.55){c.mult=+(c.mult+.2).toFixed(2);note(8,.05);toast(`${c.name}: "Fine, fine. ×${c.mult.toFixed(2)} it is."`)}else{st.cust=st.cust.filter(y=>y!==c);tone(220,.5,"sine",.04);toast(`${c.name} huffed and walked away.`)}after();return}
 if(d.shoo){st.cust=st.cust.filter(c=>c.id!==d.shoo);after();return}
 if(d.tem){if(st.team.length<3&&!st.team.includes(+d.tem))st.team.push(+d.tem);save();renderTab();return}
 if(d.untem){st.team=st.team.filter(id=>id!==+d.untem);save();renderTab();return}
 if("autoteam" in d){const seen=new Set();st.team=st.cards.filter(x=>!x.inq).sort((a,b)=>def(b).hp-def(a).hp||val(b)-val(a)).filter(x=>{const k=x.s+"-"+x.c;if(seen.has(k))return false;seen.add(k);return true}).slice(0,3).map(x=>x.id);save();renderTab();return}
 if(d.battle!==undefined&&d.battle!==""){return startBattle(+d.battle)}
 if(d.bmove!==undefined&&d.bmove!=="")return myAct("move",+d.bmove);
 if("bfocus" in d)return myAct("focus");
 if(d.bswitch!==undefined&&d.bswitch!=="")return myAct("switch",+d.bswitch);
 if("bquit" in d){B=null;st.stats.losses++;toast("You ran away. No harm done.");return closeM()}
 if("reset" in d)return modal(`<h2>Start over?</h2><p>This wipes your cash, stash, binder and seasons in this browser.</p><div class="btns" style="margin-top:14px"><button data-doreset style="background:var(--red)">Wipe and restart</button><button class="alt" data-close>Cancel</button></div>`);
 if("doreset" in d){const keep={sfx:st.sfx,music:st.music};st=fresh();Object.assign(st,keep,{tut:1});for(const k in SETC)delete SETC[k];usedNames.clear();initSeason(1);tab="stash";cset=1;closeM();after();toast("Fresh start. Your first pack is in the Stash.")}
});
/* ---------- boot ---------- */
const BUILD=2;let launch=false;
if((st.seenBuild||0)<2){if(st.season<2&&seasonNow()<2)st.start=Math.min(st.start,Date.now()-SEASON_MS);st.seenBuild=BUILD;launch=true}
checkTime();
if(launch){addSeal("b",1);addSeal("q",5);news(`UPDATE: Season ${st.season} arrived early. Your launch gift is in the Stash.`)}
after();setInterval(checkTime,1000);
if(!st.tut)setTimeout(()=>tutShow(0),500);
else if(launch)setTimeout(showLaunch,700);
if(!st.tut)launch=false;
function showLaunch(){launch=false;const S=getSet(st.season),E=EVENTS[(st.season-1)%EVENTS.length],nw2=newIn(st.season).map(k=>kind(k).n),old=getSet(st.season-1);tab="shop";renderTab();
 modal(`<div style="text-align:center"><small class="note">GENJUU UPDATE · BUILD ${BUILD}</small><h2 style="font-size:clamp(28px,4vw,42px);margin:6px 0">Season ${st.season} is here early!</h2><p class="big-res"><b>${S.n}</b> just opened at your stall.</p></div>
 <div class="fan" style="margin:10px auto 18px;max-width:420px">${[24,27,29].map((i,k)=>`<div class="fc" style="--k:${k}"><div class="tilt">${cardHTML({s:st.season,c:i})}</div></div>`).join("")}</div>
 <div class="recap">
  <div class="stat"><small>New set</small><b>30 spirits + 2 promos</b></div>
  <div class="stat"><small>Season event</small><b>${E.n}</b></div>
  <div class="stat"><small>New on the shelf</small><b>${nw2.length?nw2.join(", "):"Fresh lineup"}</b></div>
  <div class="stat"><small>${old.n} is now vintage</small><b>Worth ×${vint(st.season-1).toFixed(1)}</b></div>
  <div class="stat"><small>Launch gift (in your Stash)</small><b>Booster box + 5 premium packs</b></div>
 </div>
 <p style="text-align:center">${E.d} Your ${old.n} cards and sealed packs just went up in value, and its last boxes are on the Vintage shelf. Buy up to 1,000 at once with the number box and the Max button.</p>
 <div class="btns" style="justify-content:center;margin-top:14px">${st.recaps.length?`<button class="alt" data-recap="0">See my Season ${old.s} recap</button>`:""}<button class="alt" data-tab="stash">Open my launch gift</button><button class="gold" data-close>To the new season</button></div>`);
 sfx.season();setTimeout(()=>{burst(innerWidth/2,innerHeight/3,RCOL,140,"conf");burst(innerWidth/4,innerHeight/2,RCOL,60,"conf");burst(innerWidth*3/4,innerHeight/2,RCOL,60,"conf")},250)}
}
